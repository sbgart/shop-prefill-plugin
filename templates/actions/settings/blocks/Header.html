<div class="s-page-header">
    <div class="flexbox middle space-12 wrap">
        <div class="wide flexbox middle space-12">
            <input type="hidden" name="{$name_prefix}[active]" value="false">
            <span class="switch" data-type="switcher">
                <input type="checkbox" name="{$name_prefix}[active]" value="true" {if ifset($settings['active']) == 'true'}checked{/if}>
            </span>
            <div>
                <h1>[`title`]</h1>
            </div>
        </div>
        <div class="flexbox space-8 middle">
            {include file='./ContactsDialog.html'}
        </div>
    </div>
</div>
