<aside id="prefill-debug-stack" class="pd-panel" aria-label="{_wp('debug.panel')}">
  <header class="pd-header">
    <strong>🔍 {_wp('debug.panel')}</strong>
    <div class="pd-header__actions">
      <button type="button" data-debug-action="refresh" title="{_wp('debug.refresh')}">↻</button>
      <button type="button" data-debug-action="collapse" title="{_wp('debug.collapse')}">−</button>
      <button type="button" data-debug-action="close" title="{_wp('debug.close')}">×</button>
    </div>
  </header>
  <div id="prefill-debug-body">
    {include file='./DebugState.html'}
    <section class="pd-actions">
      <button type="button" data-debug-action="load-source">{_wp('debug.load_source')}</button>
      {if $is_admin}
        <button type="button" data-debug-action="force-prefill">{_wp('debug.force_prefill')}</button>
        <button type="button" data-debug-action="reset-refill">{_wp('debug.reset_refill')}</button>
        <button type="button" data-debug-action="clear-storage">{_wp('debug.clear_storage')}</button>
        <a href="{$settings_url|escape}" target="_blank" rel="noopener">{_wp('debug.settings')}</a>
      {/if}
      <button type="button" data-debug-action="validation">{_wp('debug.validation')}</button>
      <span class="pd-action-status" aria-live="polite"></span>
    </section>
  </div>
</aside>
